name: Reset team data (pilot)

# 試運転のデータを消す。指定したチームの タスク・日報・ミーティング記録・コメント だけを削除する。
# 名簿・設定・マイルストーン・授業日・ほかのチームには触れない。
# dry_run が true (初期値) のときは、件数を表示するだけで何も削除しない。
on:
  workflow_dispatch:
    inputs:
      teams:
        description: 対象のチーム (A〜H をカンマ区切り。例 A,B)
        required: true
      dry_run:
        description: ドライラン (true なら削除しない)
        type: boolean
        default: true
      reset_team:
        description: チームの状態も「企画検討中」に戻す (キックオフ前に戻す)
        type: boolean
        default: false
      restore_calendar:
        description: カレンダーも元に戻す (試運転データ作成で足した「ダミー(試運転)」の授業日を消し、日報の運用開始日を 10/28 に戻す)
        type: boolean
        default: false
      include_teacher_notes:
        description: そのチームの教員メモも削除する
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        working-directory: app
        run: npm ci
      - name: Write credentials
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          test -n "$SA_JSON" || { echo "FIREBASE_SERVICE_ACCOUNT が未設定です"; exit 1; }
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - name: Reset
        working-directory: app
        env:
          TEAMS: ${{ inputs.teams }}
          DRY_RUN: ${{ inputs.dry_run }}
          RESET_TEAM: ${{ inputs.reset_team }}
          INCLUDE_TEACHER_NOTES: ${{ inputs.include_teacher_notes }}
          RESTORE_CALENDAR: ${{ inputs.restore_calendar }}
        run: node scripts/reset-team-data.mjs
