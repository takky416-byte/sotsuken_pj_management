name: Rename milestones

# 行事名の言い換え: 「外部設計レビュー」→「中間報告」、「最終レビュー」→「最終発表」。
# マイルストーンの題名と、授業日の備考で、題名がちょうど一致するものだけを書き換える (先生が付けた別の題名には触らない)。
# dry_run が true (初期値) のときは、何も書き込まない。
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: ドライラン (true なら書き込まない)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        working-directory: app
        run: npm ci
      - name: Write credentials
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          test -n "$SA_JSON" || { echo "FIREBASE_SERVICE_ACCOUNT が未設定です"; exit 1; }
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - name: Rename
        working-directory: app
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/rename-milestones.mjs
