<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ログイン確認</title>
  <style>
    body { font: 16px/1.6 system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif; max-width: 520px; margin: 40px auto; padding: 0 16px; }
    button { font: inherit; padding: 10px 18px; margin: 4px 4px 4px 0; cursor: pointer; }
    pre { background: #f3f4f6; padding: 12px; border-radius: 6px; white-space: pre-wrap; word-break: break-all; font-size: 13px; }
    @media (prefers-color-scheme: dark) { body { background: #14161b; color: #e6e8ee; } pre { background: #1d2027; } }
  </style>
</head>
<body>
  <h1>ログイン確認</h1>
  <p>学校のGoogleアカウント(@trident.ac.jp)でログインできるかを確認するページです。保存される情報はありません。</p>
  <button id="login">Googleでログイン</button>
  <button id="logout" hidden>ログアウト</button>
  <p id="status"></p>
  <pre id="result"></pre>
  <button id="copy" hidden>結果をコピー</button>
  <script type="module" src="./app.js"></script>
</body>
</html>
